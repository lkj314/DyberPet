<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF1C2"/>
      <stop offset="100%" stop-color="#E0B449" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="#6FB7A8" stroke-width="3" opacity="0.85">
    <circle cx="128" cy="128" r="98" opacity="0.35"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="22s" repeatCount="indefinite"/>
      <g stroke-width="4">
        <line x1="128" y1="22" x2="128" y2="40"/>
        <line x1="128" y1="22" x2="128" y2="40" transform="rotate(45 128 128)"/>
        <line x1="128" y1="22" x2="128" y2="40" transform="rotate(90 128 128)"/>
        <line x1="128" y1="22" x2="128" y2="40" transform="rotate(135 128 128)"/>
        <line x1="128" y1="22" x2="128" y2="40" transform="rotate(180 128 128)"/>
        <line x1="128" y1="22" x2="128" y2="40" transform="rotate(225 128 128)"/>
        <line x1="128" y1="22" x2="128" y2="40" transform="rotate(270 128 128)"/>
        <line x1="128" y1="22" x2="128" y2="40" transform="rotate(315 128 128)"/>
      </g>
    </g>
  </g>
  <g fill="none" stroke="#E0B449" stroke-width="3" opacity="0.9">
    <circle cx="128" cy="128" r="64" opacity="0.4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 128 128" to="0 128 128" dur="15s" repeatCount="indefinite"/>
      <g fill="#E0B449" stroke="none">
        <circle cx="128" cy="64" r="5"/>
        <circle cx="128" cy="64" r="5" transform="rotate(60 128 128)"/>
        <circle cx="128" cy="64" r="5" transform="rotate(120 128 128)"/>
        <circle cx="128" cy="64" r="5" transform="rotate(180 128 128)"/>
        <circle cx="128" cy="64" r="5" transform="rotate(240 128 128)"/>
        <circle cx="128" cy="64" r="5" transform="rotate(300 128 128)"/>
      </g>
    </g>
  </g>
  <circle cx="128" cy="128" r="12" fill="url(#core)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
